# Server Port
server.port=8081

# Application Name
spring.application.name=shop-monolith

# Optional Local Config Import (auto-loads application-local.properties if present)
spring.config.import=optional:file:application-local.properties,optional:file:./application-local.properties

# Database Configuration (Supabase PostgreSQL with fallback to persistent H2 for restart tolerance)
# Environment variables SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD take precedence.
spring.datasource.url=${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shopdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}}
spring.datasource.username=${SUPABASE_DB_USER:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Scheduling Thread Pool
spring.task.scheduling.pool.size=5

# SQL Script Initialization (Optional)
spring.sql.init.mode=never

# LegacySupply Supplier Configuration
legacysupply.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
legacysupply.client-id=${LS_CLIENT_ID:23-5396-310}
legacysupply.api-key=${LS_API_KEY:}

# Tiangge Marketplace Configuration
tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
tiangge.client-id=${LS_CLIENT_ID:23-5396-310}
tiangge.api-key=${LS_API_KEY:}
