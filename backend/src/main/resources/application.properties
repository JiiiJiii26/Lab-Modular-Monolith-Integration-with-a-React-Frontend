# Application Configuration
server.port=8080

# Supabase Session Pooler DataSource configuration
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=30&socketTimeout=60&loginTimeout=30
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.username=postgres.xamtsuyooxcjpwbkhklf
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Inventory Configuration
app.inventory.low-stock-threshold=5

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173

# LegacySupply Supplier Configuration (Lab 3)
supplier.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
supplier.client-id=${LS_CLIENT_ID}
supplier.api-key=${LS_API_KEY}
supplier.timeout-ms=10000
supplier.max-attempts=3
supplier.retry.max-attempts=3
supplier.retry.backoff-ms=200,500,1200
supplier.scheduler.resend-fixed-delay-ms=60000
supplier.scheduler.poll-fixed-delay-ms=30000
